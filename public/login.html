<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in | Incline</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/site.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>
<header class="site-header">
  <div class="wrap">
    <a class="wordmark" href="/" aria-label="Incline, home">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
        <rect x="2" y="2" width="26" height="26" rx="8" fill="none" stroke="#4f3fe8" stroke-width="3"/>
        <path d="M8.5 21.5 L21.5 8.5 M13.5 8.5 H21.5 V16.5" fill="none" stroke="#1b2230" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Incline
    </a>
    <nav class="nav" aria-label="Main">
      <a class="nav-guides" href="/guides">Fix guides</a>
      <a class="btn btn-primary btn-small" href="/#scan">Scan a site</a>
    </nav>
  </div>
</header>
<main id="main">
  <div class="auth-wrap">
    <h1>Log in</h1>
    <p class="lede">Open your saved reports.</p>
    <div id="disabledMsg" class="empty-state" hidden>
      <h2>Accounts aren't open yet</h2>
      <p>You can still scan any public page for free, with no account.</p>
      <a class="btn btn-primary" href="/#scan">Scan a site</a>
    </div>
    <form id="loginForm" novalidate>
      <div class="form-error" id="formError" role="alert"></div>
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required>
      </div>
      <button class="btn btn-primary" id="submitBtn" type="submit">Log in</button>
    </form>
    <p class="auth-alt" id="altLink">New to Incline? <a href="/signup">Create a free account</a>.</p>
  </div>
</main>
<script src="/report.js"></script>
<script src="/nav.js"></script>
<script src="/account.js"></script>
</body>
</html>
